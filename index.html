    <script>

        };

        // GİRİŞ KONTROLÜ
        function checkAuth() {
            const email = document.getElementById("login-email").value;
            const pass = document.getElementById("login-pass").value;
            const errorMsg = document.getElementById("error-msg");

            if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                errorMsg.style.display = "none";
                document.getElementById("user-display").innerText = email;
                openPanel();
            } else {
                errorMsg.style.display = "block";
            }
        }

        function openPanel() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("main-app").style.display = "block";
        }

        function logout() {
            document.getElementById("main-app").style.display = "none";
            document.getElementById("login-screen").style.display = "flex";
            document.getElementById("login-email").value = "";
            document.getElementById("login-pass").value = "";
        }

        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("open");
        }

        // API İSTEĞİ ATMA
        async function runApi(key) {
            const outputDiv = document.getElementById("output");
            const url = apiEndpoints[key];
            
            outputDiv.innerText = `${key.toUpperCase()} servisine istek gönderiliyor...\nURL: ${url}`;
            document.getElementById("sidebar").classList.remove("open");

            try {
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP Hatası: ${response.status}`);
                }

                const data = await response.json();
                outputDiv.innerText = JSON.stringify(data, null, 2);

            } catch (error) {
                outputDiv.innerText = `Bağlantı Hatası veya CORS Engeli:\n${error.message}\n\nNot: Cloudflare Tunnel adresi aktif değilse veya API CORS izinleri vermiyorsa tarayıcı isteği engelleyebilir.`;

        }
