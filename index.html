<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREZERS SOHBET | Sesli & Yazılı Topluluk</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: rgba(22, 30, 46, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #38bdf8;
            --admin-red: #ef4444;
            --admin-glow: rgba(239, 68, 68, 0.4);
            --text: #f3f4f6;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* Modal / Auth Ekranı */
        .auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.95);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .auth-card h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 20px var(--primary-glow);
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        /* Ana Uygulama Düzeni (Dashboard) */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Sol Sidebar */
        .sidebar {
            width: 320px;
            background: rgba(15, 23, 42, 0.6);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .user-profile-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
        }

        .avatar.admin-avatar {
            border-color: var(--admin-red) !important;
            box-shadow: 0 0 15px var(--admin-glow);
        }

        .user-info h4 { font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
        .user-info p { font-size: 0.75rem; color: var(--accent); }

        .admin-badge {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 800;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px var(--admin-glow);
        }

        .search-box {
            position: relative;
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Ses Odaları & Sohbet Alanı */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        .rooms-header {
            padding: 25px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 30px;
            overflow-y: auto;
        }

        .room-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .room-card:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 30px var(--primary-glow);
            transform: translateY(-4px);
        }

        .room-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .room-badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* Profil Ayarları Modalı */
        .settings-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(10px);
            z-index: 9998;
            display: none;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- Kayıt / Giriş Modalı -->
    <div class="auth-overlay" id="authModal">
        <div class="auth-card">
            <h2>BREZERS SOHBET HOŞGELDİNİZ</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 25px;">Giriş Yapın veya Hesabınızı Oluşturun</p>

            <div class="input-group">
                <label><i class="fa-solid fa-envelope"></i> Gmail (E-Posta)</label>
                <input type="email" id="emailInput" placeholder="ornek@gmail.com">
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-key"></i> Şifre</label>
                <input type="password" id="passwordInput" placeholder="••••••••">
            </div>

            <button class="btn-primary" onclick="handleAuth()">Giriş Yap / Kaydol</button>
        </div>
    </div>

    <!-- Profil Düzenleme / Ayarlar Modalı -->
    <div class="settings-overlay" id="settingsModal">
        <div class="auth-card" style="position: relative;">
            <button onclick="closeSettings()" style="position: absolute; right: 20px; top: 20px; background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            <h3 style="margin-bottom: 20px; color: var(--accent);"><i class="fa-solid fa-gear"></i> Profil Ayarları</h3>
            
            <div class="input-group">
                <label>Yeni Kullanıcı Adı</label>
                <input type="text" id="editUsernameInput" placeholder="Kullanıcı adınızı girin">
            </div>

            <div class="input-group">
                <label>Profil Resmi (PP) URL Linki</label>
                <input type="text" id="editAvatarInput" placeholder="https://resim-linki.com/pp.png">
            </div>

            <button class="btn-primary" onclick="saveProfileSettings()">Kaydet ve Güncelle</button>
        </div>
    </div>

    <!-- Uygulama Ana Ekranı -->
    <div class="app-container">
        
        <!-- Sol Panel -->
        <div class="sidebar">
            <div class="user-profile-box">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=user" id="userAvatar" class="avatar" alt="PP">
                <div class="user-info">
                    <h4 id="displayUsername">
                        <span>Kullanıcı</span>
                        <span id="adminBadge" class="admin-badge" style="display: none;">👑 ADMIN</span>
                    </h4>
                    <p id="displayUID">UID: #------</p>
                </div>
            </div>

            <!-- Profil Ayarlarını Açma Butonu -->
            <button class="btn-primary" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text); margin-bottom: 20px;" onclick="openSettings()">
                <i class="fa-solid fa-user-pen"></i> Profili / PP Düzenle
            </button>

            <!-- UID İle Arkadaş Arama -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="uidSearchInput" placeholder="UID ile Kullanıcı Ara (#12345)" onkeyup="searchByUID()">
            </div>

            <div style="margin-top: auto;">
                <button class="btn-primary" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #ef4444;" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap
                </button>
            </div>
        </div>

        <!-- Ana Panel (Sesli Sohbet Odaları) -->
        <div class="main-content">
            <div class="rooms-header">
                <h2><i class="fa-solid fa-microphone"></i> Canlı Ses Odaları</h2>
                <button class="btn-primary" style="width: auto; padding: 10px 20px;" onclick="createRoom()">
                    + Oda Oluştur
                </button>
            </div>

            <div class="rooms-grid" id="roomsContainer">
                <!-- Örnek Ses Odası Card -->
                <div class="room-card">
                    <div class="room-title">
                        <span>🔥 BREZERS Genel Oda</span>
                        <span class="room-badge"> Canlı</span>
                    </div>
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 10px;">
                        Katılmak ve mikrofonu açmak için tıkla.
                    </p>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentUID = "";
        let isAdmin = false;

        function generateUID() {
            return Math.floor(100000 + Math.random() * 900000);
        }

        function handleAuth() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            
            if(!email || !password) {
                return alert("Lütfen Gmail ve şifrenizi girin!");
            }

            // ADMIN KONTROLÜ
            if (email === "roxhzr@gmail.com" && password === "hasan890") {
                isAdmin = true;
                currentUID = "100000"; // Admin için özel Sabit VIP UID
                
                document.getElementById('displayUsername').querySelector('span').innerText = "ROX (Kurucu)";
                document.getElementById('editUsernameInput').value = "ROX (Kurucu)";
                document.getElementById('adminBadge').style.display = "inline-block";
                document.getElementById('userAvatar').classList.add("admin-avatar");
            } else {
                isAdmin = false;
                currentUID = generateUID();
                const defaultName = email.split('@')[0];
                
                document.getElementById('displayUsername').querySelector('span').innerText = defaultName;
                document.getElementById('editUsernameInput').value = defaultName;
                document.getElementById('adminBadge').style.display = "none";
                document.getElementById('userAvatar').classList.remove("admin-avatar");
            }

            document.getElementById('displayUID').innerText = "UID: #" + currentUID;
            
            const avatarSeed = isAdmin ? "RoxAdmin" : email.split('@')[0];
            const defaultAvatar = `https://api.dicebear.com/7.x/bottts/svg?seed=${avatarSeed}`;
            
            document.getElementById('userAvatar').src = defaultAvatar;
            document.getElementById('editAvatarInput').value = defaultAvatar;

            document.getElementById('authModal').style.display = 'none';

            if(isAdmin) {
                alert("👑 Admin Hesabı ile Giriş Yapıldı! Hoşgeldin ROX.");
            }
        }

        /* Ayarlar Modal İşlemleri */
        function openSettings() {
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function saveProfileSettings() {
            const newName = document.getElementById('editUsernameInput').value;
            const newAvatar = document.getElementById('editAvatarInput').value;

            if(newName) document.getElementById('displayUsername').querySelector('span').innerText = newName;
            if(newAvatar) document.getElementById('userAvatar').src = newAvatar;

            closeSettings();
            alert("Profil bilgileriniz güncellendi!");
        }

        function searchByUID() {
            const query = document.getElementById('uidSearchInput').value;
            if(query.length >= 6) {
                console.log("UID Aratılıyor: ", query);
            }
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
