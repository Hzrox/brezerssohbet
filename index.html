<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREZERS SOHBET | Sesli & Yazılı Topluluk</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: rgba(22, 30, 46, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #38bdf8;
            --admin-red: #ef4444;
            --admin-glow: rgba(239, 68, 68, 0.4);
            --tg-color: #0088cc;
            --text: #f3f4f6;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* Modal / Auth Ekranı */
        .auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.95);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 35px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .auth-card h2 {
            font-size: 1.7rem;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        /* Auth Sekmeleri */
        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            margin: 20px 0;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-tab.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 20px var(--primary-glow);
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .btn-telegram {
            background: #0088cc;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .btn-telegram:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Dashboard */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .sidebar {
            width: 320px;
            background: rgba(15, 23, 42, 0.6);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .user-profile-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
        }

        .avatar.admin-avatar {
            border-color: var(--admin-red) !important;
            box-shadow: 0 0 15px var(--admin-glow);
        }

        .user-info h4 { font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
        .user-info p { font-size: 0.75rem; color: var(--accent); }

        .admin-badge {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 800;
            box-shadow: 0 0 10px var(--admin-glow);
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        .rooms-header {
            padding: 25px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 30px;
            overflow-y: auto;
        }

        .room-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .room-card:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 30px var(--primary-glow);
            transform: translateY(-4px);
        }

        .room-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .room-badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .settings-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(10px);
            z-index: 9998;
            display: none;
            justify-content: center;
            align-items: center;
        }

        /* Yükleme Butonu Özelleştirmesi */
        .file-upload-btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .file-upload-btn:hover {
            border-color: var(--accent);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Giriş / Kayıt Modalı -->
    <div class="auth-overlay" id="authModal">
        <div class="auth-card">
            <h2>BREZERS SOHBET HOŞGELDİNİZ</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Topluluğa Katılın ve Sohbet Edin</p>

            <!-- Giriş / Kayıt Sekmeleri -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTabBtn" onclick="switchTab('login')">Giriş Yap</button>
                <button class="auth-tab" id="registerTabBtn" onclick="switchTab('register')">Kayıt Ol</button>
            </div>

            <!-- Giriş Formu -->
            <div id="loginForm">
                <div class="input-group">
                    <label><i class="fa-solid fa-envelope"></i> Gmail (E-Posta)</label>
                    <input type="email" id="loginEmail" placeholder="ornek@gmail.com">
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-key"></i> Şifre</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>

                <button class="btn-primary" onclick="handleLogin()">Giriş Yap</button>
            </div>

            <!-- Kayıt Ol Formu -->
            <div id="registerForm" style="display: none;">
                <div class="input-group">
                    <label><i class="fa-solid fa-envelope"></i> Gmail (E-Posta)</label>
                    <input type="email" id="regEmail" placeholder="ornek@gmail.com">
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-key"></i> Şifre</label>
                    <input type="password" id="regPassword" placeholder="••••••••">
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-shield-halved"></i> Şifre Tekrarı</label>
                    <input type="password" id="regPasswordRepeat" placeholder="••••••••">
                </div>

                <button class="btn-primary" onclick="handleRegister()">Kayıt Ol</button>
            </div>
        </div>
    </div>

    <!-- Profil Düzenleme / Ayarlar Modalı -->
    <div class="settings-overlay" id="settingsModal">
        <div class="auth-card" style="position: relative;">
            <button onclick="closeSettings()" style="position: absolute; right: 20px; top: 20px; background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            <h3 style="margin-bottom: 20px; color: var(--accent);"><i class="fa-solid fa-gear"></i> Profil Ayarları</h3>
            
            <div class="input-group">
                <label>Yeni Kullanıcı Adı</label>
                <input type="text" id="editUsernameInput" placeholder="Kullanıcı adınızı girin">
            </div>

            <div class="input-group">
                <label>Cihazından Profil Resmi (PP) Seç</label>
                <label for="avatarFileInput" class="file-upload-btn">
                    <i class="fa-solid fa-image"></i> Görsel Seç / Yükle
                </label>
                <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" onchange="previewAvatar(event)">
            </div>

            <button class="btn-primary" onclick="saveProfileSettings()">Kaydet ve Güncelle</button>
        </div>
    </div>

    <!-- Uygulama Ana Ekranı -->
    <div class="app-container">
        
        <!-- Sol Panel -->
        <div class="sidebar">
            <div class="user-profile-box">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=user" id="userAvatar" class="avatar" alt="PP">
                <div class="user-info">
                    <h4 id="displayUsername">
                        <span>Kullanıcı</span>
                        <span id="adminBadge" class="admin-badge" style="display: none;">👑 ADMIN</span>
                    </h4>
                    <p id="displayUID">UID: #------</p>
                </div>
            </div>

            <!-- Telegram Butonu -->
            <a href="https://t.me/Hzrox" target="_blank" class="btn-telegram">
                <i class="fa-brands fa-telegram" style="font-size: 1.2rem;"></i> @Hzrox Telegram
            </a>

            <!-- Profil Ayarlarını Açma Butonu -->
            <button class="btn-primary" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text); margin-bottom: 15px;" onclick="openSettings()">
                <i class="fa-solid fa-user-pen"></i> Profili / PP Düzenle
            </button>

            <!-- UID İle Arkadaş Arama -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="uidSearchInput" placeholder="UID ile Kullanıcı Ara (#12345)" onkeyup="searchByUID()">
            </div>

            <div style="margin-top: auto;">
                <button class="btn-primary" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #ef4444;" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap
                </button>
            </div>
        </div>

        <!-- Ana Panel (Aktif Sesli Sohbet Odaları) -->
        <div class="main-content">
            <div class="rooms-header">
                <h2><i class="fa-solid fa-microphone"></i> Aktif Sohbet Odaları</h2>
                <button class="btn-primary" style="width: auto; padding: 10px 20px;" onclick="createRoom()">
                    + Oda Oluştur
                </button>
            </div>

            <div class="rooms-grid" id="roomsContainer">
                <!-- Aktif Odalar JavaScript İle Yüklenecek -->
            </div>
        </div>

    </div>

    <script>
        let currentUID = "";
        let isAdmin = false;
        let selectedAvatarData = null;

        // Varsayılan Aktif Sohbet Odaları
        const activeRooms = [
            { id: 1, name: "🔥 BREZERS Genel Sohbet", activeUsers: 14, badge: "Canlı" },
            { id: 2, name: "🎮 Oyun & Muhabbet", activeUsers: 8, badge: "Canlı" },
            { id: 3, name: "🎵 Müzik Dinleme Odası", activeUsers: 5, badge: "Canlı" },
            { id: 4, name: "👑 VIP / Admin Odası", activeUsers: 2, badge: "Özel" }
        ];

        function generateUID() {
            return Math.floor(100000 + Math.random() * 900000);
        }

        function switchTab(tab) {
            if(tab === 'login') {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('loginTabBtn').classList.add('active');
                document.getElementById('registerTabBtn').classList.remove('active');
            } else {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('registerTabBtn').classList.add('active');
                document.getElementById('loginTabBtn').classList.remove('active');
            }
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if(!email || !password) {
                return alert("Lütfen Gmail adresi ve şifrenizi girin!");
            }

            processAuth(email, password);
        }

        function handleRegister() {
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const passwordRepeat = document.getElementById('regPasswordRepeat').value.trim();

            if(!email || !password || !passwordRepeat) {
                return alert("Lütfen tüm alanları doldurun!");
            }

            if(password !== passwordRepeat) {
                return alert("Şifreler birbiriyle eşleşmiyor!");
            }

            alert("Hesabınız başarıyla oluşturuldu! Giriş yapılıyor...");
            processAuth(email, password);
        }

        function processAuth(email, password) {
            if (email === "roxhzr@gmail.com" && password === "hasan890") {
                isAdmin = true;
                currentUID = "100000";
                
                document.getElementById('displayUsername').querySelector('span').innerText = "ROX (Kurucu)";
                document.getElementById('editUsernameInput').value = "ROX (Kurucu)";
                document.getElementById('adminBadge').style.display = "inline-block";
                document.getElementById('userAvatar').classList.add("admin-avatar");
            } else {
                isAdmin = false;
                currentUID = generateUID();
                const defaultName = email.split('@')[0];
                
                document.getElementById('displayUsername').querySelector('span').innerText = defaultName;
                document.getElementById('editUsernameInput').value = defaultName;
                document.getElementById('adminBadge').style.display = "none";
                document.getElementById('userAvatar').classList.remove("admin-avatar");
            }

            document.getElementById('displayUID').innerText = "UID: #" + currentUID;
            
            const avatarSeed = isAdmin ? "RoxAdmin" : email.split('@')[0];
            const defaultAvatar = `https://api.dicebear.com/7.x/bottts/svg?seed=${avatarSeed}`;
            document.getElementById('userAvatar').src = defaultAvatar;

            document.getElementById('authModal').style.display = 'none';
            renderActiveRooms();
        }

        // Aktif sohbet odalarını ekrana basma
        function renderActiveRooms() {
            const container = document.getElementById('roomsContainer');
            container.innerHTML = '';

            activeRooms.forEach(room => {
                const roomElement = document.createElement('div');
                roomElement.className = 'room-card';
                roomElement.onclick = () => alert(`"${room.name}" odasına katınılıyor...`);
                roomElement.innerHTML = `
                    <div class="room-title">
                        <span>${room.name}</span>
                        <span class="room-badge">${room.badge}</span>
                    </div>
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 10px;">
                        <i class="fa-solid fa-users" style="color: var(--accent);"></i> ${room.activeUsers} Kullanıcı Aktif
                    </p>
                `;
                container.appendChild(roomElement);
            });
        }

        // Cihazdan resim seçildiğinde önizleme yapma
        function previewAvatar(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedAvatarData = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function openSettings() {
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function saveProfileSettings() {
            const newName = document.getElementById('editUsernameInput').value;

            if(newName) document.getElementById('displayUsername').querySelector('span').innerText = newName;
            if(selectedAvatarData) document.getElementById('userAvatar').src = selectedAvatarData;

            closeSettings();
            alert("Profil bilgileriniz başarıyla güncellendi!");
        }

        function searchByUID() {
            const query = document.getElementById('uidSearchInput').value;
            if(query.length >= 6) {
                console.log("UID Aratılıyor: ", query);
            }
        }

        function createRoom() {
            const roomName = prompt("Oluşturmak istediğiniz oda adını girin:");
            if(roomName) {
                activeRooms.push({
                    id: activeRooms.length + 1,
                    name: "🎙️ " + roomName,
                    activeUsers: 1,
                    badge: "Yeni"
                });
                renderActiveRooms();
            }
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
