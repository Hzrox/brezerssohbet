<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROXBREZERS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: #0a0e1a; color: #e6e6e6; min-height: 100vh; overflow-x: hidden; }

  /* ===== LOGIN / REGISTER EKRANI ===== */
  #authScreen {
    position: fixed; inset: 0; background: #0a0e1a;
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  .auth-box {
    background: #111827; padding: 40px; border-radius: 14px;
    width: 360px; max-width: 90%; border: 1px solid #1f2a44;
    box-shadow: 0 0 40px rgba(0, 140, 255, 0.15);
  }
  .auth-box h1 { color: #2196f3; text-align: center; margin-bottom: 25px; font-size: 26px; letter-spacing: 3px; }
  .auth-box input {
    width: 100%; padding: 12px; margin-bottom: 14px;
    background: #0a0e1a; border: 1px solid #1f2a44; border-radius: 8px;
    color: #e6e6e6; font-size: 14px; outline: none;
  }
  .auth-box input:focus { border-color: #2196f3; }
  .auth-box button {
    width: 100%; padding: 12px; background: #2196f3; color: #fff;
    border: none; border-radius: 8px; font-size: 15px; cursor: pointer;
    font-weight: bold; letter-spacing: 1px; transition: .2s;
  }
  .auth-box button:hover { background: #1976d2; }
  .auth-toggle { text-align: center; margin-top: 15px; font-size: 13px; color: #8a94a6; }
  .auth-toggle span { color: #2196f3; cursor: pointer; text-decoration: underline; }
  .auth-msg { text-align: center; font-size: 13px; margin-top: 10px; min-height: 18px; }
  .msg-err { color: #ff5252; }
  .msg-ok { color: #4caf50; }

  /* ===== ANA SİTE ===== */
  #mainSite { display: none; }

  /* Burger Menü */
  #burger {
    position: fixed; top: 20px; left: 20px; z-index: 1001;
    width: 42px; height: 42px; background: #111827; border: 1px solid #1f2a44;
    border-radius: 8px; cursor: pointer; display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 5px; transition: .2s;
  }
  #burger:hover { border-color: #2196f3; }
  #burger div { width: 22px; height: 2px; background: #2196f3; transition: .3s; }

  /* Sidebar */
  #sidebar {
    position: fixed; top: 0; left: -300px; width: 280px; height: 100vh;
    background: #0d1424; border-right: 1px solid #1f2a44;
    z-index: 1000; transition: left .3s ease; overflow-y: auto;
    padding: 80px 15px 20px;
  }
  #sidebar.open { left: 0; }
  .menu-item {
    display: block; width: 100%; padding: 13px 15px; margin-bottom: 8px;
    background: #111827; border: 1px solid #1f2a44; border-radius: 8px;
    color: #cfd8e3; font-size: 14px; cursor: pointer; text-align: left;
    transition: .2s; font-family: inherit;
  }
  .menu-item:hover { background: #16213e; border-color: #2196f3; color: #2196f3; }
  .menu-item.active { background: #16213e; border-color: #2196f3; color: #2196f3; }
  .menu-title { color: #4a5568; font-size: 11px; letter-spacing: 2px; margin: 15px 5px 8px; text-transform: uppercase; }

  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 999; display: none;
  }
  #overlay.show { display: block; }

  /* Orta Logo */
  #centerLogo {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 52px; font-weight: bold; color: #2196f3; letter-spacing: 8px;
    text-shadow: 0 0 30px rgba(33, 150, 243, 0.6);
    user-select: none; pointer-events: none; text-align: center;
    transition: opacity .3s;
  }
  #centerLogo.hide { opacity: 0; }

  /* Çalışma Paneli */
  #panel {
    max-width: 900px; margin: 0 auto; padding: 100px 20px 60px;
    display: none;
  }
  #panel.show { display: block; }
  .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 25px; flex-wrap: wrap; gap: 10px;
  }
  .panel-head h2 { color: #2196f3; font-size: 22px; letter-spacing: 2px; }
  .logout-btn {
    padding: 8px 16px; background: #2a1a1a; border: 1px solid #ff5252;
    color: #ff5252; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .logout-btn:hover { background: #ff5252; color: #fff; }

  .query-box {
    background: #111827; border: 1px solid #1f2a44; border-radius: 12px;
    padding: 25px; margin-bottom: 20px;
  }
  .query-box label { display: block; color: #8a94a6; font-size: 13px; margin-bottom: 8px; }
  .query-box input {
    width: 100%; padding: 12px; background: #0a0e1a; border: 1px solid #1f2a44;
    border-radius: 8px; color: #e6e6e6; font-size: 15px; outline: none; margin-bottom: 12px;
  }
  .query-box input:focus { border-color: #2196f3; }
  .query-box button {
    padding: 11px 28px; background: #2196f3; color: #fff; border: none;
    border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; letter-spacing: 1px;
  }
  .query-box button:hover { background: #1976d2; }
  .query-box button:disabled { background: #374151; cursor: not-allowed; }

  .result-box {
    background: #0d1424; border: 1px solid #1f2a44; border-radius: 12px;
    padding: 20px; margin-top: 20px; max-height: 500px; overflow: auto;
  }
  .result-box pre {
    color: #a5d6ff; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;
    font-family: 'Consolas', monospace; line-height: 1.6;
  }
  .loading { color: #ffc107; font-size: 14px; margin-top: 12px; }
  .error-txt { color: #ff5252; font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>

<!-- ===== LOGIN / REGISTER ===== -->
<div id="authScreen">
  <div class="auth-box">
    <h1>ROXBREZERS</h1>
    <input type="text" id="authUser" placeholder="Kullanıcı Adı" autocomplete="off">
    <input type="password" id="authPass" placeholder="Şifre" autocomplete="off">
    <button id="authBtn">GİRİŞ YAP</button>
    <div class="auth-toggle">
      <span id="toggleMode">Hesabın yok mu? Kayıt ol</span>
    </div>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<!-- ===== ANA SİTE ===== -->
<div id="mainSite">

  <div id="burger">
    <div></div><div></div><div></div>
  </div>

  <div id="overlay"></div>

  <div id="sidebar">
    <div class="menu-title">Sorgular</div>
    <button class="menu-item" data-type="tc">🪪 TC Sorgu</button>
    <button class="menu-item" data-type="aile">👪 Aile</button>
    <button class="menu-item" data-type="sulale">🌳 Sülale</button>
    <button class="menu-item" data-type="cocuk">👶 Çocuklar</button>
    <button class="menu-item" data-type="adres">📍 Adres</button>
    <button class="menu-item" data-type="gsmtc">📞 GSM → TC</button>
    <button class="menu-item" data-type="tcgsm">☎️ TC → GSM</button>
    <button class="menu-item" data-type="isyeri">🏢 İşyeri</button>
    <button class="menu-item" data-type="adsoyad">🔎 Ad Soyad Arama</button>
    <div class="menu-title">Hesap</div>
    <button class="menu-item" id="sideLogout">🚪 Çıkış Yap</button>
  </div>

  <div id="centerLogo">ROXBREZERS</div>

  <div id="panel">
    <div class="panel-head">
      <h2 id="panelTitle">TC Sorgu</h2>
      <button class="logout-btn" id="topLogout">Çıkış</button>
    </div>

    <div class="query-box" id="queryBox">
      <!-- Dinamik input alanları buraya JS ile gelecek -->
    </div>

    <div id="resultArea"></div>
  </div>

</div>

<script>
/* =========================================================
   ROXBREZERS PANEL
   GitHub Pages uyumlu tek dosya
   ========================================================= */

const API_KEY = "Hzrox_1faecd7b086a";
const API_BASE = "https://searchulp.xyz/api";

/* ---------- ENDPOINT TANIMLARI ---------- */
const ENDPOINTS = {
  tc:      { title: "TC Sorgu",        inputs: [{ id: "tc",  label: "TC Kimlik No", placeholder: "11 haneli TC" }], path: (v) => `/tc/${v.tc}` },
  aile:    { title: "Aile",            inputs: [{ id: "tc",  label: "TC Kimlik No", placeholder: "11 haneli TC" }], path: (v) => `/aile/${v.tc}` },
  sulale:  { title: "Sülale",          inputs: [{ id: "tc",  label: "TC Kimlik No", placeholder: "11 haneli TC" }], path: (v) => `/sulale/${v.tc}` },
  cocuk:   { title: "Çocuklar",        inputs: [{ id: "tc",  label: "TC Kimlik No", placeholder: "11 haneli TC" }], path: (v) => `/cocuk/${v.tc}` },
  adres:   { title: "Adres",           inputs: [{ id: "tc",  label: "TC Kimlik No", placeholder: "11 haneli TC" }], path: (v) => `/adres/${v.tc}` },
  gsmtc:   { title: "GSM → TC",        inputs: [{ id: "gsm", label: "GSM No",       placeholder: "5XXXXXXXXX" }], path: (v) => `/gsmtc/${v.gsm}` },
  tcgsm:   { title: "TC → GSM",        inputs: [{ id: "tc",  label: "TC Kimlik No", placeholder: "11 haneli TC" }], path: (v) => `/tcgsm/${v.tc}` },
  isyeri:  { title: "İşyeri",          inputs: [{ id: "tc",  label: "TC Kimlik No", placeholder: "11 haneli TC" }], path: (v) => `/isyeri/${v.tc}` },
  adsoyad: {
    title: "Ad Soyad Arama",
    inputs: [
      { id: "ad",         label: "Ad",          placeholder: "Ad" },
      { id: "soyad",      label: "Soyad",       placeholder: "Soyad" },
      { id: "il",         label: "İl (opsiyonel)",     placeholder: "İl" },
      { id: "ilce",       label: "İlçe (opsiyonel)",   placeholder: "İlçe" },
      { id: "dogumtarihi",label: "Doğum Tarihi (ops.)", placeholder: "GG.AA.YYYY" }
    ],
    path: () => null
  }
};

/* ---------- LOCALSTORAGE AUTH ---------- */
function getUsers() {
  try { return JSON.parse(localStorage.getItem("rox_users") || "{}"); }
  catch(e) { return {}; }
}
function saveUsers(u) { localStorage.setItem("rox_users", JSON.stringify(u)); }

function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) - h) + str.charCodeAt(i);
    h |= 0;
  }
  return "h" + Math.abs(h).toString(36) + "_" + str.length;
}

/* ---------- AUTH EKRANI ---------- */
let isRegisterMode = false;
const authScreen = document.getElementById("authScreen");
const authUser   = document.getElementById("authUser");
const authPass   = document.getElementById("authPass");
const authBtn    = document.getElementById("authBtn");
const authMsg    = document.getElementById("authMsg");
const toggleMode = document.getElementById("toggleMode");

toggleMode.addEventListener("click", () => {
  isRegisterMode = !isRegisterMode;
  authBtn.textContent = isRegisterMode ? "KAYIT OL" : "GİRİŞ YAP";
  toggleMode.textContent = isRegisterMode ? "Zaten hesabın var mı? Giriş yap" : "Hesabın yok mu? Kayıt ol";
  authMsg.textContent = "";
  authMsg.className = "auth-msg";
});

authBtn.addEventListener("click", doAuth);
authPass.addEventListener("keydown", (e) => { if (e.key === "Enter") doAuth(); });

function doAuth() {
  const u = authUser.value.trim();
  const p = authPass.value;

  if (!u || !p) {
    authMsg.textContent = "Kullanıcı adı ve şifre gerekli.";
    authMsg.className = "auth-msg msg-err";
    return;
  }
  if (u.length < 3) {
    authMsg.textContent = "Kullanıcı adı en az 3 karakter.";
    authMsg.className = "auth-msg msg-err";
    return;
  }
  if (p.length < 4) {
    authMsg.textContent = "Şifre en az 4 karakter.";
    authMsg.className = "auth-msg msg-err";
    return;
  }

  const users = getUsers();

  if (isRegisterMode) {
    if (users[u]) {
      authMsg.textContent = "Bu kullanıcı adı zaten var.";
      authMsg.className = "auth-msg msg-err";
      return;
    }
    users[u] = simpleHash(p);
    saveUsers(users);
    authMsg.textContent = "Kayıt başarılı! Giriş yapılıyor...";
    authMsg.className = "auth-msg msg-ok";
    setTimeout(() => loginSuccess(u), 700);
  } else {
    if (!users[u]) {
      authMsg.textContent = "Kullanıcı bulunamadı.";
      authMsg.className = "auth-msg msg-err";
      return;
    }
    if (users[u] !== simpleHash(p)) {
      authMsg.textContent = "Şifre yanlış.";
      authMsg.className = "auth-msg msg-err";
      return;
    }
    authMsg.textContent = "Giriş başarılı!";
    authMsg.className = "auth-msg msg-ok";
    setTimeout(() => loginSuccess(u), 500);
  }
}

function loginSuccess(username) {
  localStorage.setItem("rox_session", username);
  authScreen.style.display = "none";
  document.getElementById("mainSite").style.display = "block";
  document.getElementById("centerLogo").classList.remove("hide");
}

function logout() {
  localStorage.removeItem("rox_session");
  location.reload();
}

/* ---------- OTURUM KONTROL ---------- */
window.addEventListener("DOMContentLoaded", () => {
  const sess = localStorage.getItem("rox_session");
  if (sess) {
    authScreen.style.display = "none";
    document.getElementById("mainSite").style.display = "block";
    document.getElementById("centerLogo").classList.remove("hide");
  }
});

/* ---------- BURGER MENÜ ---------- */
const burger  = document.getElementById("burger");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const panel   = document.getElementById("panel");
const centerLogo = document.getElementById("centerLogo");

burger.addEventListener("click", () => {
  sidebar.classList.toggle("open");
  overlay.classList.toggle("show");
});
overlay.addEventListener("click", () => {
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
});

document.getElementById("sideLogout").addEventListener("click", logout);
document.getElementById("topLogout").addEventListener("click", logout);

/* ---------- MENÜ TIKLAMA ---------- */
document.querySelectorAll(".menu-item[data-type]").forEach(btn => {
  btn.addEventListener("click", () => {
    const type = btn.dataset.type;
    document.querySelectorAll(".menu-item").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    openPanel(type);
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
  });
});

/* ---------- PANEL AÇ ---------- */
function openPanel(type) {
  const ep = ENDPOINTS[type];
  if (!ep) return;

  centerLogo.classList.add("hide");
  panel.classList.add("show");
  document.getElementById("panelTitle").textContent = ep.title;

  const qBox = document.getElementById("queryBox");
  qBox.innerHTML = "";

  ep.inputs.forEach(inp => {
    const label = document.createElement("label");
    label.textContent = inp.label;
    const input = document.createElement("input");
    input.type = "text";
    input.id = "inp_" + inp.id;
    input.placeholder = inp.placeholder;
    qBox.appendChild(label);
    qBox.appendChild(input);
  });

  const btn = document.createElement("button");
  btn.textContent = "SORGULA";
  btn.id = "queryBtn";
  btn.addEventListener("click", () => runQuery(type));
  qBox.appendChild(btn);

  // Enter tuşu ile sorgu
  qBox.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter") runQuery(type);
    });
  });

  document.getElementById("resultArea").innerHTML = "";
}

/* ---------- SORGU ÇALIŞTIR ---------- */
async function runQuery(type) {
  const ep = ENDPOINTS[type];
  const resultArea = document.getElementById("resultArea");
  const btn = document.getElementById("queryBtn");

  const values = {};
  for (const inp of ep.inputs) {
    const el = document.getElementById("inp_" + inp.id);
    values[inp.id] = el ? el.value.trim() : "";
  }

  // Zorunlu alan kontrolü (adsoyad için ad+soyad zorunlu, il/ilce/tarih opsiyonel)
  if (type === "adsoyad") {
    if (!values.ad || !values.soyad) {
      resultArea.innerHTML = '<div class="error-txt">Ad ve Soyad zorunlu.</div>';
      return;
    }
  } else {
    const first = ep.inputs[0].id;
    if (!values[first]) {
      resultArea.innerHTML = '<div class="error-txt">Lütfen gerekli alanı doldur.</div>';
      return;
    }
  }

  let url = "";
  if (type === "adsoyad") {
    url = `${API_BASE}/adsoyad?ad=${encodeURIComponent(values.ad)}&soyad=${encodeURIComponent(values.soyad)}`;
    if (values.il)         url += `&il=${encodeURIComponent(values.il)}`;
    if (values.ilce)       url += `&ilce=${encodeURIComponent(values.ilce)}`;
    if (values.dogumtarihi) url += `&dogumtarihi=${encodeURIComponent(values.dogumtarihi)}`;
    url += `&key=${API_KEY}`;
  } else {
    const path = ep.path(values);
    url = `${API_BASE}${path}?key=${API_KEY}`;
  }

  resultArea.innerHTML = '<div class="loading">⏳ Sorgulanıyor...</div>';
  btn.disabled = true;

  try {
    const res = await fetch(url, {
      method: "GET",
      headers: { "Accept": "application/json" }
    });

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch(e) { data = { raw: text }; }

    if (!res.ok) {
      resultArea.innerHTML = `<div class="error-txt">Hata (${res.status}):</div>
        <div class="result-box"><pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre></div>`;
    } else {
      resultArea.innerHTML = `<div class="result-box"><pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre></div>`;
    }
  } catch (err) {
    resultArea.innerHTML = `<div class="error-txt">Bağlantı hatası: ${escapeHtml(err.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}

/* ---------- HTML ESCAPE ---------- */
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* ---------- LOGO GERİ GEL (panel boşken) ---------- */
// Panel açıldıktan sonra logo gizli kalır, sidebar kapanınca geri gelmez.
// İstersen buraya "paneli kapat" özelliği ekleyebiliriz.

</script>
</body>
</html>
