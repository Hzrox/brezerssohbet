<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREZERS SOHBET | Sesli & Yazılı Topluluk</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: rgba(22, 30, 46, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #38bdf8;
            --admin-red: #ef4444;
            --admin-glow: rgba(239, 68, 68, 0.4);
            --text: #f3f4f6;
            --text-muted: #94a3b8;
            --green: #22c55e;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }

        body { 
            background-color: var(--bg-main); 
            color: var(--text); 
            min-height: 100vh; 
            display: flex; 
            overflow: hidden; 
        }

        /* Auth Screen Modal */
        .auth-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(9, 13, 22, 0.95); 
            backdrop-filter: blur(15px); 
            z-index: 9999; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        .auth-card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            padding: 35px 40px; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 440px; 
            text-align: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
        }

        .auth-card h2 { 
            font-size: 1.7rem; 
            margin-bottom: 6px; 
            background: linear-gradient(135deg, #38bdf8, #6366f1); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            font-weight: 800; 
        }
        
        .auth-tabs { 
            display: flex; 
            background: rgba(255, 255, 255, 0.05); 
            border-radius: 12px; 
            padding: 4px; 
            margin: 20px 0; 
        }

        .auth-tab { 
            flex: 1; 
            padding: 10px; 
            border: none; 
            background: transparent; 
            color: var(--text-muted); 
            font-weight: 600; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.3s; 
        }

        .auth-tab.active { 
            background: var(--primary); 
            color: #fff; 
            box-shadow: 0 0 10px var(--primary-glow); 
        }

        .input-group { 
            margin-bottom: 16px; 
            text-align: left; 
        }

        .input-group label { 
            display: block; 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            margin-bottom: 6px; 
        }

        .input-group input { 
            width: 100%; 
            padding: 12px 16px; 
            border-radius: 12px; 
            background: rgba(255,255,255,0.04); 
            border: 1px solid var(--border-color); 
            color: #fff; 
            outline: none; 
            transition: all 0.3s; 
        }

        .input-group input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 15px var(--primary-glow); 
        }

        .btn-primary { 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            border: none; 
            background: linear-gradient(135deg, var(--primary), #4f46e5); 
            color: #fff; 
            font-weight: 700; 
            cursor: pointer; 
            box-shadow: 0 0 20px var(--primary-glow); 
            transition: transform 0.2s, background 0.3s; 
        }

        .btn-primary:hover { 
            transform: translateY(-2px); 
        }

        .btn-telegram { 
            background: #0088cc; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            text-decoration: none; 
            color: #fff; 
            font-weight: 600; 
            padding: 12px; 
            border-radius: 12px; 
            margin-bottom: 12px; 
            transition: all 0.3s; 
        }

        /* Main Dashboard Layout */
        .app-container { 
            display: flex; 
            width: 100vw; 
            height: 100vh; 
        }

        .sidebar { 
            width: 300px; 
            background: rgba(15, 23, 42, 0.8); 
            border-right: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            padding: 20px; 
        }

        .user-profile-box { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            padding: 12px; 
            background: rgba(255,255,255,0.03); 
            border: 1px solid var(--border-color); 
            border-radius: 16px; 
            margin-bottom: 15px; 
        }

        .avatar { 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid var(--primary); 
        }

        .avatar.speaking { 
            border-color: var(--green) !important; 
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6); 
        }

        .avatar.admin-avatar { 
            border-color: var(--admin-red) !important; 
            box-shadow: 0 0 15px var(--admin-glow); 
        }

        .user-info h4 { 
            font-size: 0.9rem; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }

        .user-info p { 
            font-size: 0.75rem; 
            color: var(--accent); 
        }

        .admin-badge { 
            background: linear-gradient(135deg, #ef4444, #b91c1c); 
            color: #fff; 
            font-size: 0.6rem; 
            padding: 2px 6px; 
            border-radius: 6px; 
            font-weight: 800; 
        }

        /* Content Area & Voice Room Layout */
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: var(--bg-main); 
            position: relative; 
        }

        .rooms-header { 
            padding: 20px 30px; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .rooms-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 20px; 
            padding: 30px; 
            overflow-y: auto; 
        }
        
        .room-card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            border-radius: 20px; 
            padding: 20px; 
            transition: all 0.3s; 
            cursor: pointer; 
        }

        .room-card:hover { 
            border-color: var(--primary); 
            box-shadow: 0 10px 30px var(--primary-glow); 
            transform: translateY(-4px); 
        }

        .room-title { 
            font-size: 1rem; 
            font-weight: 700; 
            margin-bottom: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
        }

        .room-badge { 
            background: rgba(56, 189, 248, 0.1); 
            color: var(--accent); 
            font-size: 0.7rem; 
            padding: 4px 8px; 
            border-radius: 20px; 
        }

        /* Inside Active Voice Room View */
        .active-room-view { 
            display: none; 
            flex-direction: column; 
            height: 100%; 
            background: #0c121e; 
        }

        .room-nav { 
            padding: 15px 25px; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(15, 23, 42, 0.9); 
        }

        .room-body { 
            display: flex; 
            flex: 1; 
            overflow: hidden; 
        }

        .voice-participants { 
            flex: 1; 
            padding: 30px; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 20px; 
            align-content: start; 
            overflow-y: auto; 
        }

        .participant-card { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: rgba(255,255,255,0.03); 
            border: 1px solid var(--border-color); 
            padding: 15px; 
            border-radius: 16px; 
            text-align: center; 
        }

        .participant-card img { 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            margin-bottom: 8px; 
        }

        /* Chat Side Panel */
        .chat-panel { 
            width: 320px; 
            background: rgba(15, 23, 42, 0.7); 
            border-left: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
        }

        .chat-messages { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }

        .chat-msg { 
            background: rgba(255,255,255,0.04); 
            padding: 10px 12px; 
            border-radius: 10px; 
            font-size: 0.85rem; 
        }

        .chat-msg b { 
            color: var(--accent); 
            display: block; 
            font-size: 0.75rem; 
            margin-bottom: 2px; 
        }

        .chat-input-box { 
            padding: 12px; 
            border-top: 1px solid var(--border-color); 
            display: flex; 
            gap: 8px; 
        }

        .chat-input-box input { 
            flex: 1; 
            padding: 10px; 
            border-radius: 10px; 
            border: 1px solid var(--border-color); 
            background: rgba(0,0,0,0.2); 
            color: #fff; 
            outline: none; 
        }

        /* Bottom Controls Bar */
        .room-controls { 
            padding: 15px 30px; 
            border-top: 1px solid var(--border-color); 
            background: rgba(15, 23, 42, 0.9); 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
        }

        .control-btn { 
            width: 48px; 
            height: 48px; 
            border-radius: 50%; 
            border: none; 
            background: rgba(255,255,255,0.1); 
            color: #fff; 
            font-size: 1.1rem; 
            cursor: pointer; 
            transition: all 0.3s; 
        }

        .control-btn.active { 
            background: var(--admin-red); 
        }

        .control-btn:hover { 
            transform: scale(1.08); 
        }

        /* Modals */
        .modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.8); 
            backdrop-filter: blur(8px); 
            z-index: 9998; 
            display: none; 
            justify-content: center; 
            align-items: center; 
        }

        .admin-modal { 
            background: var(--bg-card); 
            border: 1px solid var(--admin-red); 
            padding: 25px; 
            border-radius: 20px; 
            width: 550px; 
            max-height: 80vh; 
            overflow-y: auto; 
        }

        .user-manage-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px; 
            border-bottom: 1px solid var(--border-color); 
        }

        .action-btn { 
            padding: 6px 12px; 
            border-radius: 8px; 
            border: none; 
            font-size: 0.75rem; 
            cursor: pointer; 
            font-weight: 700; 
        }

        .btn-ban { 
            background: var(--admin-red); 
            color: #fff; 
        }

        .btn-mute { 
            background: #f59e0b; 
            color: #fff; 
        }

        .file-upload-btn { 
            display: inline-block; 
            width: 100%; 
            padding: 10px; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px dashed var(--border-color); 
            border-radius: 12px; 
            text-align: center; 
            cursor: pointer; 
            color: var(--text-muted); 
            font-size: 0.8rem; 
        }
    </style>
</head>
<body>

    <!-- Auth Modal -->
    <div class="auth-overlay" id="authModal">
        <div class="auth-card">
            <h2>BREZERS SOHBET</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Topluluğa Katılın ve Canlı Sesli Sohbet Edin</p>

            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTabBtn" onclick="switchTab('login')">Giriş Yap</button>
                <button class="auth-tab" id="registerTabBtn" onclick="switchTab('register')">Kayıt Ol</button>
            </div>

            <div id="loginForm">
                <div class="input-group">
                    <label><i class="fa-solid fa-envelope"></i> Gmail (E-Posta)</label>
                    <input type="email" id="loginEmail" placeholder="ornek@gmail.com">
                </div>
                <div class="input-group">
                    <label><i class="fa-solid fa-key"></i> Şifre</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>
                <button class="btn-primary" onclick="handleLogin()">Giriş Yap</button>
            </div>

            <div id="registerForm" style="display: none;">
                <div class="input-group">
                    <label><i class="fa-solid fa-envelope"></i> Gmail (E-Posta)</label>
                    <input type="email" id="regEmail" placeholder="ornek@gmail.com">
                </div>
                <div class="input-group">
                    <label><i class="fa-solid fa-key"></i> Şifre</label>
                    <input type="password" id="regPassword" placeholder="••••••••">
                </div>
                <div class="input-group">
                    <label><i class="fa-solid fa-shield-halved"></i> Şifre Tekrarı</label>
                    <input type="password" id="regPasswordRepeat" placeholder="••••••••">
                </div>
                <button class="btn-primary" onclick="handleRegister()">Kayıt Ol</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div class="modal-overlay" id="adminModal">
        <div class="admin-modal">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: var(--admin-red);"><i class="fa-solid fa-user-shield"></i> Admin Yönetim Paneli</h3>
                <button onclick="closeAdminModal()" style="background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">Aktif kullanıcıları susturun veya siteden banlayın.</p>
            <div id="adminUserList"></div>
        </div>
    </div>

    <!-- Profile Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="auth-card" style="position: relative;">
            <button onclick="closeSettings()" style="position: absolute; right: 20px; top: 20px; background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            <h3 style="margin-bottom: 20px; color: var(--accent);"><i class="fa-solid fa-gear"></i> Profil Ayarları</h3>
            <div class="input-group">
                <label>Yeni Kullanıcı Adı</label>
                <input type="text" id="editUsernameInput" placeholder="Kullanıcı adınızı girin">
            </div>
            <div class="input-group">
                <label>Cihazından Profil Resmi Seç</label>
                <label for="avatarFileInput" class="file-upload-btn"><i class="fa-solid fa-image"></i> Görsel Yükle</label>
                <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" onchange="previewAvatar(event)">
            </div>
            <button class="btn-primary" onclick="saveProfileSettings()">Kaydet ve Güncelle</button>
        </div>
    </div>

    <!-- Main App Container -->
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="user-profile-box">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=user" id="userAvatar" class="avatar" alt="PP">
                <div class="user-info">
                    <h4 id="displayUsername">
                        <span>Kullanıcı</span>
                        <span id="adminBadge" class="admin-badge" style="display: none;">👑 ADMIN</span>
                    </h4>
                    <p id="displayUID">UID: #------</p>
                </div>
            </div>

            <a href="https://t.me/Hzrox" target="_blank" class="btn-telegram">
                <i class="fa-brands fa-telegram" style="font-size: 1.2rem;"></i> @Hzrox Telegram
            </a>

            <button id="adminPanelBtn" class="btn-primary" style="display: none; background: rgba(239, 68, 68, 0.2); border: 1px solid var(--admin-red); color: var(--admin-red); margin-bottom: 10px;" onclick="openAdminModal()">
                <i class="fa-solid fa-shield-halved"></i> Admin Paneli
            </button>

            <button class="btn-primary" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text); margin-bottom: 15px;" onclick="openSettings()">
                <i class="fa-solid fa-user-pen"></i> Profili / PP Düzenle
            </button>

            <div style="margin-top: auto;">
                <button class="btn-primary" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #ef4444;" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap
                </button>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            
            <!-- 1. Lobi View -->
            <div id="lobbyView" style="display: flex; flex-direction: column; height: 100%;">
                <div class="rooms-header">
                    <h2><i class="fa-solid fa-microphone"></i> Aktif Canlı Odalar</h2>
                    <button class="btn-primary" style="width: auto; padding: 10px 20px;" onclick="createNewRealRoom()">+ Oda Oluştur</button>
                </div>
                <div class="rooms-grid" id="roomsContainer">
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Yükleniyor...</p>
                </div>
            </div>

            <!-- 2. Active Voice Room View -->
            <div class="active-room-view" id="activeRoomView">
                <div class="room-nav">
                    <div>
                        <h3 id="currentRoomTitle">🎙️️ Genel Sohbet</h3>
                        <p style="font-size: 0.75rem; color: var(--accent);" id="currentRoomUsersCount">0 Kullanıcı Bağlı</p>
                    </div>
                    <button class="btn-primary" style="width: auto; background: var(--admin-red); padding: 8px 16px;" onclick="leaveRoom()">
                        <i class="fa-solid fa-phone-slash"></i> Odadan Ayrıl
                    </button>
                </div>

                <div class="room-body">
                    <!-- Katılımcı Kartları -->
                    <div class="voice-participants" id="participantsContainer"></div>

                    <!-- Canlı Chat -->
                    <div class="chat-panel">
                        <div style="padding: 12px; border-bottom: 1px solid var(--border-color); font-weight: 700; font-size: 0.85rem;">
                            <i class="fa-solid fa-comments"></i> Oda İçi Chat
                        </div>
                        <div class="chat-messages" id="chatMessages"></div>
                        <div class="chat-input-box">
                            <input type="text" id="chatInput" placeholder="Mesaj yazın..." onkeypress="handleChatKeyPress(event)">
                            <button class="btn-primary" style="width: auto; padding: 0 15px;" onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>

                <!-- Alt Ses Kontrolleri -->
                <div class="room-controls">
                    <button class="control-btn" id="micBtn" onclick="toggleMic()" title="Mikrofon Aç/Kapat"><i class="fa-solid fa-microphone"></i></button>
                    <button class="control-btn" id="deafenBtn" onclick="toggleDeafen()" title="Kulaklık Sustur"><i class="fa-solid fa-volume-high"></i></button>
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentUID = "";
        let currentUsername = "";
        let isAdmin = false;
        let isMuted = false;
        let isDeafened = false;
        let selectedAvatarData = null;

        let activeRealRooms = [
            { id: 1, name: "🔥 BREZERS Genel Sohbet", users: [{ uid: "100000", name: "ROX (Kurucu)", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=RoxAdmin" }] },
            { id: 2, name: "🎮 Oyun & Muhabbet", users: [] },
            { id: 3, name: "🎵 Müzik Dinleme Odası", users: [] }
        ];

        let currentJoinedRoom = null;
        let bannedUsers = [];
        let mutedUsers = [];

        function generateUID() { 
            return Math.floor(100000 + Math.random() * 900000); 
        }

        function switchTab(tab) {
            if(tab === 'login') {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('loginTabBtn').classList.add('active');
                document.getElementById('registerTabBtn').classList.remove('active');
            } else {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('registerTabBtn').classList.add('active');
                document.getElementById('loginTabBtn').classList.remove('active');
            }
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if(!email || !password) return alert("Lütfen email ve şifre girin!");
            processAuth(email, password);
        }

        function handleRegister() {
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const passwordRepeat = document.getElementById('regPasswordRepeat').value.trim();
            if(!email || !password || !passwordRepeat) return alert("Tüm alanları doldurun!");
            if(password !== passwordRepeat) return alert("Şifreler eşleşmiyor!");
            processAuth(email, password);
        }

        function processAuth(email, password) {
            if (email === "roxhzr@gmail.com" && password === "hasan890") {
                isAdmin = true;
                currentUID = "100000";
                currentUsername = "ROX (Kurucu)";
                document.getElementById('adminBadge').style.display = "inline-block";
                document.getElementById('adminPanelBtn').style.display = "block";
                document.getElementById('userAvatar').classList.add("admin-avatar");
            } else {
                isAdmin = false;
                currentUID = generateUID().toString();
                currentUsername = email.split('@')[0];
                document.getElementById('adminBadge').style.display = "none";
                document.getElementById('adminPanelBtn').style.display = "none";
                document.getElementById('userAvatar').classList.remove("admin-avatar");
            }

            document.getElementById('displayUsername').querySelector('span').innerText = currentUsername;
            document.getElementById('displayUID').innerText = "UID: #" + currentUID;
            
            if(!selectedAvatarData) {
                const avatarSeed = isAdmin ? "RoxAdmin" : currentUsername;
                document.getElementById('userAvatar').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${avatarSeed}`;
            }

            document.getElementById('authModal').style.display = 'none';
            renderLobbyRooms();
        }

        function createNewRealRoom() {
            const roomName = prompt("Oluşturulacak Canlı Oda Adı:");
            if(!roomName) return;

            const newRoom = {
                id: Date.now(),
                name: roomName,
                users: []
            };

            activeRealRooms.push(newRoom);
            renderLobbyRooms();
            joinRoom(newRoom.id);
        }

        function renderLobbyRooms() {
            const container = document.getElementById('roomsContainer');
            container.innerHTML = '';

            if(activeRealRooms.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Henüz açık oda yok. İlk odayı sen oluştur!</p>';
                return;
            }

            activeRealRooms.forEach(room => {
                const card = document.createElement('div');
                card.className = 'room-card';
                card.onclick = () => joinRoom(room.id);
                card.innerHTML = `
                    <div class="room-title">
                        <span>${room.name}</span>
                        <span class="room-badge">Canlı Ses</span>
                    </div>
                    <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 10px;">
                        <i class="fa-solid fa-users" style="color: var(--accent);"></i> ${room.users.length} Katılımcı
                    </p>
                `;
                container.appendChild(card);
            });
        }

        function joinRoom(roomId) {
            if(bannedUsers.includes(currentUID)) {
                return alert("⛔ Yönetici tarafından bu platformdan banlandınız!");
            }

            const room = activeRealRooms.find(r => r.id === roomId);
            if(!room) return;

            currentJoinedRoom = room;

            if(!room.users.find(u => u.uid === currentUID)) {
                room.users.push({ 
                    uid: currentUID, 
                    name: currentUsername, 
                    avatar: document.getElementById('userAvatar').src 
                });
            }

            document.getElementById('lobbyView').style.display = 'none';
            document.getElementById('activeRoomView').style.display = 'flex';
            document.getElementById('currentRoomTitle').innerText = room.name;
            
            updateRoomParticipants();
            renderLobbyRooms();
        }

        function leaveRoom() {
            if(currentJoinedRoom) {
                currentJoinedRoom.users = currentJoinedRoom.users.filter(u => u.uid !== currentUID);
            }
            currentJoinedRoom = null;
            document.getElementById('activeRoomView').style.display = 'none';
            document.getElementById('lobbyView').style.display = 'flex';
            renderLobbyRooms();
        }

        function updateRoomParticipants() {
            if(!currentJoinedRoom) return;
            const container = document.getElementById('participantsContainer');
            container.innerHTML = '';

            document.getElementById('currentRoomUsersCount').innerText = `${currentJoinedRoom.users.length} Katılımcı Odada`;

            currentJoinedRoom.users.forEach(u => {
                const card = document.createElement('div');
                card.className = 'participant-card';
                card.innerHTML = `
                    <img src="${u.avatar}" class="avatar ${u.uid === currentUID && !isMuted ? 'speaking' : ''}">
                    <span style="font-size:0.8rem; font-weight:700;">${u.name}</span>
                    <span style="font-size:0.65rem; color:var(--text-muted); margin-top:4px;">
                        ${u.uid === currentUID && isMuted ? 'Muted' : 'Aktif'}
                    </span>
                `;
                container.appendChild(card);
            });
        }

        function toggleMic() {
            if(mutedUsers.includes(currentUID)) {
                return alert("⚠️ Yönetici tarafından susturuldunuz (Muted)!");
            }
            isMuted = !isMuted;
            const btn = document.getElementById('micBtn');
            btn.classList.toggle('active', isMuted);
            btn.innerHTML = isMuted ? '<i class="fa-solid fa-microphone-slash"></i>' : '<i class="fa-solid fa-microphone"></i>';
            updateRoomParticipants();
        }

        function toggleDeafen() {
            isDeafened = !isDeafened;
            const btn = document.getElementById('deafenBtn');
            btn.classList.toggle('active', isDeafened);
            btn.innerHTML = isDeafened ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
        }

        function sendChatMessage() {
            if(mutedUsers.includes(currentUID)) return alert("⚠️ Susturulduğunuz için mesaj gönderemezsiniz.");
            const input = document.getElementById('chatInput');
            const txt = input.value.trim();
            if(!txt) return;

            const chatBox = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg';
            msgDiv.innerHTML = `<b>${currentUsername}</b> ${txt}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            input.value = '';
        }

        function handleChatKeyPress(e) {
            if(e.key === 'Enter') sendChatMessage();
        }

        function openAdminModal() {
            if(!isAdmin) return;
            const listContainer = document.getElementById('adminUserList');
            listContainer.innerHTML = '';

            let allUsers = [];
            activeRealRooms.forEach(r => allUsers.push(...r.users));

            if(allUsers.length === 0) {
                listContainer.innerHTML = '<p style="color:var(--text-muted);">Şu an odalarda kimse yok.</p>';
            } else {
                allUsers.forEach(u => {
                    if(u.uid === currentUID) return;
                    const isUserMuted = mutedUsers.includes(u.uid);
                    const item = document.createElement('div');
                    item.className = 'user-manage-item';
                    item.innerHTML = `
                        <div>
                            <b>${u.name}</b> <span style="font-size:0.75rem; color:var(--text-muted);">(UID: #${u.uid})</span>
                        </div>
                        <div style="display:flex; gap:6px;">
                            <button class="action-btn btn-mute" onclick="adminMuteUser('${u.uid}')">${isUserMuted ? 'Susturmayı Kaldır' : 'Sustur'}</button>
                            <button class="action-btn btn-ban" onclick="adminBanUser('${u.uid}')">Banla / At</button>
                        </div>
                    `;
                    listContainer.appendChild(item);
                });
            }

            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdminModal() { 
            document.getElementById('adminModal').style.display = 'none'; 
        }

        function adminMuteUser(uid) {
            if(mutedUsers.includes(uid)) {
                mutedUsers = mutedUsers.filter(id => id !== uid);
                alert("Kullanıcının susturması kaldırıldı.");
            } else {
                mutedUsers.push(uid);
                alert("Kullanıcı susturuldu.");
            }
            openAdminModal();
        }

        function adminBanUser(uid) {
            bannedUsers.push(uid);
            alert("Kullanıcı banlandı!");
            activeRealRooms.forEach(r => {
                r.users = r.users.filter(u => u.uid !== uid);
            });
            renderLobbyRooms();
            openAdminModal();
        }

        function previewAvatar(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    selectedAvatarData = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function openSettings() { 
            document.getElementById('settingsModal').style.display = 'flex'; 
        }

        function closeSettings() { 
            document.getElementById('settingsModal').style.display = 'none'; 
        }

        function saveProfileSettings() {
            const newName = document.getElementById('editUsernameInput').value.trim();
            if(newName) {
                currentUsername = newName;
                document.getElementById('displayUsername').querySelector('span').innerText = newName;
            }
            if(selectedAvatarData) {
                document.getElementById('userAvatar').src = selectedAvatarData;
            }
            closeSettings();
        }

        function logout() { 
            location.reload(); 
        }
    </script>
</body>
</html>
