<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brezers Sohbet - Giriş / Kayıt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b131a;
            background-image: linear-gradient(rgba(11, 19, 26, 0.7), rgba(11, 19, 26, 0.85)), url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            width: 900px;
            height: 520px;
            background: rgba(13, 20, 28, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            display: flex;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        /* Sol Taraf - Marka / Logo Alanı */
        .brand-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .logo-img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(0, 255, 100, 0.3));
        }

        .brand-title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .brand-subtitle {
            font-size: 15px;
            color: #8b9bb4;
            margin-bottom: 30px;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 220px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 15px;
            border-radius: 8px;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(0, 255, 128, 0.3);
        }

        /* Sağ Taraf - Form Alanı */
        .form-section {
            flex: 1.2;
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-box {
            display: none;
        }

        .form-box.active {
            display: block;
        }

        h2 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 25px;
            color: #ffffff;
            text-align: center;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            background: rgba(22, 33, 43, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #00b862;
        }

        input::placeholder {
            color: #6b7c93;
        }

        .eye-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6b7c93;
            font-size: 14px;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot-password a, .switch-form a {
            color: #00b862;
            text-decoration: none;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        .forgot-password a:hover, .switch-form a:hover {
            opacity: 0.8;
        }

        .submit-btn {
            width: 100%;
            background: #00a859;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 15px;
        }

        .submit-btn:hover {
            background: #00c868;
        }

        .alt-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .alt-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px;
            border-radius: 8px;
            color: #cbd5e1;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }

        .alt-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .switch-form {
            text-align: center;
            font-size: 13px;
            color: #8b9bb4;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sol Sabit Alan (Tasarım ve Sosyal Medya) -->
        <div class="brand-section">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop" alt="Brezers Logo" class="logo-img">
            <div class="brand-title">Brezers Sohbet</div>
            <div class="brand-subtitle">Hoşgeldiniz</div>
            
            <div class="social-links">
                <a href="https://t.me/Hzrox" target="_blank" class="social-btn">
                    <span>Telegram: @Hzrox</span>
                </a>
                <a href="https://wa.me/905397141379" target="_blank" class="social-btn">
                    <span>WhatsApp: +90 539 714 13 79</span>
                </a>
            </div>
        </div>

        <!-- Sağ Taraf - Dinamik Form Alanı -->
        <div class="form-section">
            
            <!-- Giriş Yap Formu (Temiz) -->
            <div id="loginForm" class="form-box active">
                <h2>Giriş Yap</h2>
                <div class="input-group">
                    <input type="email" placeholder="Email Adresi">
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Şifre">
                    <span class="eye-icon">👁️</span>
                </div>
                <div class="forgot-password">
                    <a href="#">Şifremi Unuttum</a>
                </div>
                <button class="submit-btn">Giriş Yap</button>
                
                <div class="alt-buttons">
                    <a href="https://t.me/Hzrox" target="_blank" class="alt-btn">Telegram</a>
                    <a href="https://discord.com" target="_blank" class="alt-btn">Discord</a>
                </div>
                
                <div class="switch-form">
                    Henüz üye değil misiniz? <a href="#" onclick="toggleForm(event)">Kaydolun</a>
                </div>
            </div>

            <!-- Hesap Oluştur Formu -->
            <div id="registerForm" class="form-box">
                <h2>Hesap Oluştur</h2>
                <div class="input-group">
                    <input type="text" placeholder="Kullanıcı Adı">
                </div>
                <div class="input-group">
                    <input type="email" placeholder="Email Adresi">
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Şifre">
                    <span class="eye-icon">👁️️</span>
                </div>
                <button class="submit-btn">Hesap Oluştur</button>
                
                <div class="alt-buttons">
                    <a href="https://t.me/Hzrox" target="_blank" class="alt-btn">Telegram</a>
                    <a href="https://discord.com" target="_blank" class="alt-btn">Discord</a>
                </div>
                
                <div class="switch-form">
                    Zaten üye misiniz? <a href="#" onclick="toggleForm(event)">Giriş Yap</a>
                </div>
            </div>

        </div>
    </div>

    <script>
        function toggleForm(e) {
            e.preventDefault();
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            
            loginForm.classList.toggle('active');
            registerForm.classList.toggle('active');
        }
    </script>
</body>
</html>
